<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Student Task Manager</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <h1>Welcome Back</h1>
        <p>Sign in to continue managing your tasks.</p>
        <form class="auth-form" id="loginForm">
          <label>
            Email
            <input type="email" placeholder="student@example.com" required />
          </label>
          <label>
            Password
            <input type="password" placeholder="••••••••" required />
          </label>
          <button class="btn btn-primary full-width" type="submit">Login</button>
        </form>
        <p class="auth-link">Need an account? <a href="register.html">Create one</a></p>
      </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
