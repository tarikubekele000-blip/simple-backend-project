<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Student Task Manager</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="brand sidebar-brand">
          <span class="brand-mark">✓</span>
          <span>TaskFlow</span>
        </div>
        <nav class="sidebar-nav">
          <a class="active" href="dashboard.html">Dashboard</a>
          <a href="tasks.html">My Tasks</a>
          <a href="profile.html">Profile</a>
          <a href="settings.html">Settings</a>
        </nav>
        <a class="btn btn-secondary full-width" href="index.html">Logout</a>
      </aside>

      <main class="main-content">
        <header class="content-header">
          <div>
            <p class="eyebrow">Dashboard</p>
            <h1>Welcome back, Ava</h1>
          </div>
          <div class="header-actions">
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle color theme">☀️</button>
            <a class="btn btn-primary" href="tasks.html">+ New Task</a>
          </div>
        </header>

        <section class="stats-grid">
          <article class="stat-card">
            <h3>Total Tasks</h3>
            <p id="totalTasks">0</p>
          </article>
          <article class="stat-card">
            <h3>Completed</h3>
            <p id="completedTasks">0</p>
          </article>
          <article class="stat-card">
            <h3>Pending</h3>
            <p id="pendingTasks">0</p>
          </article>
          <article class="stat-card">
            <h3>Overdue</h3>
            <p id="overdueTasks">0</p>
          </article>
        </section>

        <section class="panel-grid">
          <article class="card large-card">
            <div class="card-header">
              <h2>Productivity</h2>
              <span class="muted" id="progressLabel">0%</span>
            </div>
            <div class="progress-bar"><div id="progressBar"></div></div>
          </article>
          <article class="card">
            <div class="card-header">
              <h2>Today's Tasks</h2>
              <span class="muted">Live</span>
            </div>
            <ul class="task-list" id="todayTasks"></ul>
          </article>
        </section>

        <section class="card">
          <div class="card-header">
            <h2>Recent Tasks</h2>
            <a href="tasks.html">View All</a>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Task</th>
                  <th>Subject</th>
                  <th>Priority</th>
                  <th>Status</th>
                  <th>Due</th>
                </tr>
              </thead>
              <tbody id="recentTasksTable"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast"></div>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
