<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - Student Task Manager</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="brand sidebar-brand">
          <span class="brand-mark">✓</span>
          <span>TaskFlow</span>
        </div>
        <nav class="sidebar-nav">
          <a href="dashboard.html">Dashboard</a>
          <a href="tasks.html">My Tasks</a>
          <a class="active" href="profile.html">Profile</a>
          <a href="settings.html">Settings</a>
        </nav>
        <a class="btn btn-secondary full-width" href="index.html">Logout</a>
      </aside>

      <main class="main-content">
        <header class="content-header">
          <div>
            <p class="eyebrow">Profile</p>
            <h1>Student profile</h1>
          </div>
          <div class="header-actions">
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle color theme">☀️</button>
          </div>
        </header>

        <section class="profile-card card">
          <div class="profile-header">
            <div class="avatar">AJ</div>
            <div>
              <h2>Ava Johnson</h2>
              <p>ava.johnson@school.edu</p>
            </div>
          </div>
          <div class="profile-grid">
            <div>
              <h3>School</h3>
              <p>Northfield High School</p>
            </div>
            <div>
              <h3>Grade</h3>
              <p>Grade 11</p>
            </div>
          </div>
          <form class="auth-form profile-form">
            <label>Name<input type="text" name="name" value="Ava Johnson" /></label>
            <label>Email<input type="email" name="email" value="ava.johnson@school.edu" /></label>
            <label>School<input type="text" name="school" value="Northfield High School" /></label>
            <label>Grade<input type="text" name="grade" value="Grade 11" /></label>
            <button class="btn btn-primary" type="submit">Save Changes</button>
          </form>
        </section>
      </main>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
