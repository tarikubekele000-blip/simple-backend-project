<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Tasks - Student Task Manager</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="brand sidebar-brand">
          <span class="brand-mark">✓</span>
          <span>TaskFlow</span>
        </div>
        <nav class="sidebar-nav">
          <a href="dashboard.html">Dashboard</a>
          <a class="active" href="tasks.html">My Tasks</a>
          <a href="profile.html">Profile</a>
          <a href="settings.html">Settings</a>
        </nav>
        <a class="btn btn-secondary full-width" href="index.html">Logout</a>
      </aside>

      <main class="main-content">
        <header class="content-header">
          <div>
            <p class="eyebrow">My Tasks</p>
            <h1>Manage your school workload</h1>
          </div>
          <div class="header-actions">
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle color theme">☀️</button>
            <button class="btn btn-primary" id="openTaskModal">+ Add Task</button>
          </div>
        </header>

        <section class="toolbar card">
          <div class="toolbar-group">
            <input type="search" id="searchInput" placeholder="Search tasks" />
          </div>
          <div class="toolbar-group">
            <select id="categoryFilter">
              <option value="all">All Categories</option>
              <option value="Homework">Homework</option>
              <option value="Assignment">Assignment</option>
              <option value="Project">Project</option>
              <option value="Exam">Exam</option>
              <option value="Reading">Reading</option>
              <option value="Personal">Personal</option>
            </select>
            <select id="priorityFilter">
              <option value="all">All Priorities</option>
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
            </select>
            <select id="sortSelect">
              <option value="dueDate">Sort by Due </option>
              <option value="createdAt">Sort by Created</option>
              <option value="title">Sort by Title</option>
            </select>
          </div>
        </section>

        <section class="card">
          <div class="card-header">
            <h2>Task List</h2>
            <span class="muted">Stored locally</span>
          </div>
          <div id="tasksContainer" class="tasks-grid"></div>
        </section>
      </main>
    </div>

    <div class="modal" id="taskModal" aria-hidden="true">
      <div class="modal-content form-modal">
        <h3 id="taskModalTitle">Add Task</h3>
        <form id="taskForm">
          <input type="hidden" id="taskId" />
          <label>Title<input type="text" id="title" required /></label>
          <label>Description<textarea id="description"></textarea></label>
          <div class="form-grid">
            <label>Subject<input type="text" id="subject" required /></label>
            <label>Category<select id="category"><option>Homework</option><option>Assignment</option><option>Project</option><option>Exam</option><option>Reading</option><option>Personal</option></select></label>
            <label>Priority<select id="priority"><option>Low</option><option selected>Medium</option><option>High</option></select></label>
            <label>Due Date<input type="date" id="dueDate" required /></label>
          </div>
          <label>Status<select id="status"><option>Pending</option><option>Completed</option></select></label>
          <div class="modal-actions">
            <button class="btn btn-secondary" type="button" id="closeTaskModal">Cancel</button>
            <button class="btn btn-primary" type="submit">Save Task</button>
          </div>
        </form>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="modal" id="confirmModal" aria-hidden="true">
      <div class="modal-content">
        <h3 id="confirmModalTitle">Confirm deletion</h3>
        <p id="confirmModalMessage">Are you sure you want to delete this task?</p>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="cancelConfirm">Cancel</button>
          <button class="btn btn-primary" id="confirmDelete">Delete</button>
        </div>
      </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/tasks.js"></script>
  </body>
</html>
